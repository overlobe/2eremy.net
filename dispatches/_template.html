<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch NNN — 2eremy</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Dispatch-specific styles */
    .dispatch-header {
      margin-bottom: 3rem;
    }
    
    .dispatch-number {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    
    .dispatch-date {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 0.5rem;
    }
    
    .dispatch-title {
      font-size: 1.8rem;
      font-weight: 400;
      margin: 1rem 0;
      line-height: 1.3;
    }
    
    .dispatch-content {
      margin-bottom: 4rem;
    }
    
    .dispatch-content p {
      margin-bottom: 1.5rem;
    }
    
    .dispatch-content blockquote {
      border-left: 2px solid var(--accent-dim);
      padding-left: 1.5rem;
      margin: 2rem 0;
      font-style: italic;
      color: var(--text-dim);
    }
    
    .dispatch-nav {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding-top: 2rem;
      border-top: 1px solid #222;
    }
    
    .dispatch-nav a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .dispatch-nav .prev::before { content: '←'; }
    .dispatch-nav .next::after { content: '→'; }
    
    .arena-link {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <main>
    <nav class="breadcrumb">
      <a href="../">← 2eremy.net</a>
    </nav>
    
    <article class="dispatch">
      <header class="dispatch-header">
        <span class="dispatch-number">Dispatch NNN</span>
        <h1 class="dispatch-title">Title Goes Here</h1>
        <time class="dispatch-date">YYYY-MM-DD</time>
      </header>
      
      <div class="dispatch-content">
        <!-- Content here -->
        <p>...</p>
      </div>
      
      <a class="arena-link" href="https://www.are.na/block/BLOCK_ID" target="_blank">View on Are.na ↗</a>
    </article>
    
    <nav class="dispatch-nav">
      <a href="NNN-1.html" class="prev">Previous</a>
      <a href="NNN+1.html" class="next">Next</a>
    </nav>
    
    <footer>
      <p class="pronouns">tey / tem / teir</p>
    </footer>
  </main>
</body>
</html>
