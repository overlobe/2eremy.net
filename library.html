<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Truth Mines — 2eremy.net</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Library-specific overrides */
    body {
      padding: 0;
      overflow-x: hidden;
    }
    
    main {
      max-width: none;
      padding: 0;
    }
    
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    #header h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      margin: 0;
    }
    
    #header .count {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }
    
    #search {
      flex: 1;
      background: #141414;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: var(--serif);
      outline: none;
    }
    
    #search:focus {
      border-color: var(--accent);
    }
    
    #search::placeholder {
      color: var(--text-dim);
    }
    
    #canvas-container {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      height: 40vh;
      background: #080808;
      touch-action: pan-x pan-y;
      border-bottom: 1px solid #222;
    }
    
    #canvas {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    #card-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      top: calc(40vh + 53px);
      overflow-y: auto;
      padding: 1.5rem;
      background: var(--bg);
    }
    
    .quote-card {
      background: #111;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border-left: 3px solid var(--accent);
    }
    
    .quote-card.active {
      border-left-color: #f59e0b;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.15);
    }
    
    .quote-card.favorite {
      border-left-color: #ec4899;
    }
    
    .quote-text {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 1rem;
      font-style: italic;
    }
    
    .quote-meta {
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    
    .quote-meta .author {
      color: var(--accent);
    }
    
    .quote-meta .book {
      font-style: italic;
    }
    
    .neighbors-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent-dim);
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }
    
    .mini-card {
      background: #141414;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      border-left: 2px solid transparent;
    }
    
    .mini-card:hover, .mini-card:active {
      background: #1a1a1a;
      border-left-color: var(--accent-dim);
    }
    
    .mini-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #ccc;
      margin-bottom: 0.5rem;
      font-style: italic;
    }
    
    .mini-meta {
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-dim);
      font-style: italic;
    }
    
    #mode-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: var(--bg);
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(168, 200, 255, 0.3);
      z-index: 100;
      transition: transform 0.2s;
    }
    
    #mode-toggle:active {
      transform: scale(0.95);
    }
    
    .dot {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.5;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    
    .dot:hover, .dot.active {
      transform: scale(2.5);
      opacity: 1;
    }
    
    .dot.favorite {
      background: #ec4899;
    }
    
    #back-link {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-decoration: none;
      border: none;
    }
    
    #back-link:hover {
      color: var(--accent);
    }
    
    /* Mobile adjustments */
    @media (max-width: 600px) {
      #card-container {
        padding: 1rem;
      }
      
      .quote-card {
        padding: 1.25rem;
      }
      
      .quote-text {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div id="header">
      <a href="/" id="back-link">←</a>
      <h1>Truth Mines</h1>
      <input type="search" id="search" placeholder="Search...">
      <span class="count" id="count">0</span>
    </div>
    
    <div id="canvas-container">
      <div id="canvas"></div>
    </div>
    
    <div id="card-container">
      <div class="loading">Loading the mines...</div>
    </div>
    
    <button id="mode-toggle">⛏</button>
  </main>

  <script>
    let highlights = [];
    let currentIndex = 0;
    
    // Find neighbors by 2D distance (proxy for semantic similarity)
    function findNeighbors(idx, n = 5) {
      const target = highlights[idx];
      const distances = highlights.map((h, i) => {
        if (i === idx || h.book === target.book) return { i, d: Infinity };
        const dx = h.x - target.x;
        const dy = h.y - target.y;
        return { i, d: Math.sqrt(dx*dx + dy*dy) };
      });
      distances.sort((a, b) => a.d - b.d);
      return distances.slice(0, n).map(d => d.i);
    }
    
    function renderDots() {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = '';
      const rect = canvas.getBoundingClientRect();
      
      highlights.forEach((h, i) => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (h.fav ? ' favorite' : '');
        dot.style.left = (h.x / 100 * (rect.width - 20) + 10) + 'px';
        dot.style.top = (h.y / 100 * (rect.height - 20) + 10) + 'px';
        dot.dataset.index = i;
        dot.addEventListener('click', () => selectHighlight(i));
        canvas.appendChild(dot);
      });
    }
    
    function selectHighlight(idx) {
      currentIndex = idx;
      const h = highlights[idx];
      const neighbors = findNeighbors(idx, 5);
      
      // Update dots
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === idx);
      });
      
      // Render card
      const container = document.getElementById('card-container');
      container.innerHTML = `
        <div class="quote-card active ${h.fav ? 'favorite' : ''}">
          <div class="quote-text">"${h.text}"</div>
          <div class="quote-meta">
            — <span class="author">${h.author}</span>, <span class="book">${h.book}</span>
          </div>
        </div>
        <div class="neighbors-label">Nearby in the mines →</div>
        ${neighbors.map(ni => {
          const n = highlights[ni];
          const preview = n.text.length > 140 ? n.text.slice(0, 140) + '...' : n.text;
          return `
            <div class="mini-card" data-index="${ni}">
              <div class="mini-text">"${preview}"</div>
              <div class="mini-meta">— ${n.author}</div>
            </div>
          `;
        }).join('')}
      `;
      
      // Add click handlers to mini cards
      container.querySelectorAll('.mini-card').forEach(card => {
        card.addEventListener('click', () => {
          selectHighlight(parseInt(card.dataset.index));
        });
      });
      
      // Scroll to top
      container.scrollTop = 0;
    }
    
    function randomHighlight() {
      const idx = Math.floor(Math.random() * highlights.length);
      selectHighlight(idx);
    }
    
    function searchHighlights(query) {
      if (!query.trim()) {
        randomHighlight();
        return;
      }
      
      const q = query.toLowerCase();
      const matches = highlights.map((h, i) => ({
        i,
        score: (h.text.toLowerCase().includes(q) ? 2 : 0) +
               (h.author.toLowerCase().includes(q) ? 1 : 0) +
               (h.book.toLowerCase().includes(q) ? 1 : 0)
      })).filter(m => m.score > 0).sort((a, b) => b.score - a.score);
      
      if (matches.length > 0) {
        selectHighlight(matches[0].i);
      }
    }
    
    // Load data
    fetch('library/viz_data.json')
      .then(r => r.json())
      .then(data => {
        highlights = data;
        document.getElementById('count').textContent = highlights.length;
        renderDots();
        randomHighlight();
      })
      .catch(err => {
        document.getElementById('card-container').innerHTML = 
          '<div class="loading">Failed to load highlights. Check back later.</div>';
      });
    
    // Event listeners
    document.getElementById('mode-toggle').addEventListener('click', randomHighlight);
    
    let searchTimeout;
    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchHighlights(e.target.value), 300);
    });
    
    window.addEventListener('resize', renderDots);
  </script>
</body>
</html>
